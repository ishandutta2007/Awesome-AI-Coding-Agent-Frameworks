<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glow Filters -->
    <radialGradient id="ambient-cyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-purple" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-orbit {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.35; }
      50% { transform: translateY(-12px) rotate(3deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(0deg); opacity: 0.35; }
    }
    @keyframes pulse-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-pill-1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float-pill-2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
      100% { transform: translateY(0px); }
    }
    @keyframes float-pill-3 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes shimmer-line {
      0% { opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { opacity: 0.2; }
    }
    .flow-line {
      stroke-dasharray: 8 12;
      animation: pulse-flow 12s linear infinite;
    }
    .pill-1 { animation: float-pill-1 4.5s ease-in-out infinite; }
    .pill-2 { animation: float-pill-2 5.5s ease-in-out infinite 0.8s; }
    .pill-3 { animation: float-pill-3 4.8s ease-in-out infinite 1.6s; }
    .node-orbit { animation: pulse-orbit 8s ease-in-out infinite; }
    .grid-shimmer { animation: shimmer-line 6s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="20" fill="url(#ambient-cyan)" />
  <rect width="1200" height="420" rx="20" fill="url(#ambient-purple)" />

  <!-- Background Technical Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1" class="grid-shimmer">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Background Connection Lines & Circuit Pulses (strictly in background) -->
  <g class="flow-line" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M 80,340 C 220,380 400,320 600,350 C 800,380 980,310 1120,340" />
    <path d="M 120,90 C 350,40 520,110 740,60 C 920,20 1020,100 1100,70" stroke="#06b6d4" stroke-opacity="0.3" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs / Geometric Nodes in Background -->
  <g class="node-orbit">
    <circle cx="160" cy="90" r="4" fill="#38bdf8" />
    <circle cx="160" cy="90" r="16" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    
    <circle cx="1060" cy="330" r="5" fill="#c084fc" />
    <circle cx="1060" cy="330" r="22" fill="none" stroke="#c084fc" stroke-opacity="0.25" stroke-width="1.5" />

    <circle cx="980" cy="100" r="4" fill="#818cf8" />
    <circle cx="980" cy="100" r="18" fill="none" stroke="#818cf8" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- Card Border Outline -->
  <rect x="2" y="2" width="1196" height="416" rx="19" fill="none" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- ================= FOREGROUND CONTENT ================= -->

  <!-- Top Pill / Super-Header -->
  <g transform="translate(420, 48)">
    <rect x="0" y="0" width="360" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" filter="url(#badge-glow)" />
    <circle cx="20" cy="17" r="5" fill="#10b981" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#primary-glow)" letter-spacing="-0.5" filter="url(#shadow-glow)">
      Awesome AI Coding Agents
    </text>
  </g>

  <!-- Subtitle Line 1 -->
  <g transform="translate(600, 202)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f1f5f9">
      Autonomous SWE Frameworks &bull; AI-First IDEs &bull; Developer Tooling
    </text>
  </g>

  <!-- Subtitle Line 2 -->
  <g transform="translate(600, 235)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Tracking Frontier SaaS Platforms &amp; Open-Source Breakthroughs with Live Metrics
    </text>
  </g>

  <!-- Foreground Feature Dynamic Pills (Floating Gently Below Title) -->
  <g transform="translate(190, 280)">
    <!-- Pill 1: Commercial Leaders -->
    <g class="pill-1" transform="translate(0, 0)">
      <rect width="250" height="48" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2" />
      <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">⚡ Frontier SaaS</text>
      <text x="142" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Cursor, Copilot</text>
    </g>

    <!-- Pill 2: Open Source Stars -->
    <g class="pill-2" transform="translate(280, 0)">
      <rect width="260" height="48" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.2" />
      <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818cf8">🌟 Open Source</text>
      <text x="140" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">OpenHands, Cline</text>
    </g>

    <!-- Pill 3: Autonomous SWE -->
    <g class="pill-3" transform="translate(570, 0)">
      <rect width="250" height="48" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#c084fc" stroke-width="1.2" />
      <text x="24" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc">🤖 SWE Agents</text>
      <text x="135" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Aider, SWE-bench</text>
    </g>
  </g>

  <!-- Bottom Stat Bar Text -->
  <g transform="translate(600, 385)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="0.5">
      UPDATED OCTOBER 2026 &bull; COMMUNITY CURATED &bull; ZERO TRACKING
    </text>
  </g>
</svg>
